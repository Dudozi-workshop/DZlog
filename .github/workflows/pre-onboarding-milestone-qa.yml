name: Pre-onboarding milestone QA
on:
  push:
    branches:
      - qa/pre-onboarding-milestone-20261017
    paths:
      - .github/workflows/pre-onboarding-milestone-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Confirm milestone source is unchanged
        shell: bash
        run: |
          git merge-base --is-ancestor 5ba5d0bb411d72ef73b579aba5453b42ed94f730 HEAD
          git diff --exit-code 5ba5d0bb411d72ef73b579aba5453b42ed94f730 HEAD -- app
      - name: Unit tests and isolated QA APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug -PdzlogStandaloneQa=true -PdzlogQaInstanceTag=preonboard -PdzlogDebugVersionCode=${{ github.run_number }} --stacktrace
      - name: Upload QA APK and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dzlog-pre-onboarding-qa-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 14
