name: Onboarding Folder Targeted QA

on:
  push:
    branches:
      - fix/onboarding-first-install-folder-20261022
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: onboarding-folder-targeted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  targeted-android-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android platform 36
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - name: Compile and run only onboarding and gallery storage regression tests
        run: |
          bash ./gradlew --no-daemon :app:testDebugUnitTest \
            --tests 'com.dudoziworkshop.dzlog.ui.navigation.RequiredPermissionStateTest' \
            --tests 'com.dudoziworkshop.dzlog.data.mediastore.GalleryFolderDeletionTest'
      - name: Upload targeted test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onboarding-folder-targeted-tests
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
