name: DZlog Onboarding Auto Folder QA
on:
  push:
    branches:
      - fix/onboarding-first-install-folder-20261022
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dzlog-onboarding-auto-folder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  onboarding-folder-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Focused permission and storage tests
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.dudoziworkshop.dzlog.ui.navigation.RequiredPermissionStateTest' \
            --tests 'com.dudoziworkshop.dzlog.data.mediastore.GalleryFolderDeletionTest' \
            --stacktrace
      - name: Full Android regression and Kotlin compilation
        run: ./gradlew :app:testDebugUnitTest :app:compileDebugKotlin --stacktrace
      - name: Build isolated QA APK
        run: ./gradlew :app:assembleDebug -PdzlogStandaloneQa=true -PdzlogQaInstanceTag=autofolder -PdzlogDebugVersionCode=1000088 --stacktrace
      - name: Verify isolated package and signature
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          "$SDK_ROOT/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/debug/app-debug.apk
          "$SDK_ROOT/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -m1 "package: name='com.dudoziworkshop.dzlog.qa.autofolder' versionCode='1000088'"
          cp app/build/outputs/apk/debug/app-debug.apk DZlog-onboarding-auto-folder-QA.apk
      - name: Upload isolated QA APK
        uses: actions/upload-artifact@v4
        with:
          name: DZlog-onboarding-auto-folder-QA
          path: DZlog-onboarding-auto-folder-QA.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dzlog-onboarding-folder-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 7
