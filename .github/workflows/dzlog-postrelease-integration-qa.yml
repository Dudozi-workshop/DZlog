name: DZlog Post-release Integration QA

on:
  push:
    branches:
      - integration/dzlog-postrelease-staging-20261014
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dzlog-postrelease-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out integrated source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android API 36
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - name: Verify migration policy and billing stays unlocked
        run: |
          grep -q 'compileSdk = 36' app/build.gradle.kts
          grep -q 'targetSdk = 36' app/build.gradle.kts
          grep -q 'ALL_UNLOCKED' app/src/main/java/com/dudoziworkshop/dzlog/feature/table/policy/MonetizationRolloutPolicy.kt
          grep -q 'RequiredPermissionsGate' app/src/main/java/com/dudoziworkshop/dzlog/MainActivity.kt
          grep -q 'OnboardingStartupGate' app/src/main/java/com/dudoziworkshop/dzlog/MainActivity.kt
      - name: Test dormant billing backend
        run: node --test billing-server/test/*.test.mjs
      - name: Run Android unit tests and compile debug build
        run: bash ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postrelease-integration-unit-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
