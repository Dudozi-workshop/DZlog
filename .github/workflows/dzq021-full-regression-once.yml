name: DZQ-021 Full Android Regression (one-time)

on:
  push:
    branches:
      - test/dzq021-integration-20261103
    paths:
      - '.github/workflows/dzq021-full-regression-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-unit-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout combined project code
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run complete Android unit suite and build isolated QA APK
        run: |
          bash ./gradlew :app:testDebugUnitTest :app:assembleDebug \
            -PdzlogStandaloneQa=true \
            -PdzlogQaInstanceTag=dzq021 --stacktrace
      - name: Upload entire unit-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dzq021-combined-full-android-unit-tests
          path: |
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/tests/testDebugUnitTest/**
          retention-days: 7
          if-no-files-found: ignore
