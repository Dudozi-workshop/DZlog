name: Capture pipeline Android tests

on:
  push:
    branches:
      - feat/capture-async-pipeline-v1
  pull_request:
    branches:
      - integration/dzlog-20261010
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK 34
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"
      - name: Full Android unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Build isolated Capture QA APK
        run: |
          QA_VERSION_CODE="$((1000000 + GITHUB_RUN_NUMBER))"
          ./gradlew :app:assembleDebug -PdzlogStandaloneQa=true -PdzlogDebugVersionCode="$QA_VERSION_CODE" --stacktrace
          APK="app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"
          BADGING="$("$AAPT" dump badging "$APK" | head -1)"
          echo "$BADGING"
          [[ "$BADGING" == *"name='com.dudoziworkshop.dzlog.qa'"* ]]
          [[ "$BADGING" != *"name='com.dudoziworkshop.dzlog'"* ]]
          mkdir -p qa-output
          cp app/build/outputs/apk/debug/app-debug.apk "qa-output/DZlog-Capture-QA-${GITHUB_RUN_NUMBER}.apk"
          cd qa-output
          sha256sum *.apk > SHA256SUMS.txt
      - name: Publish installable QA APK
        uses: actions/upload-artifact@v4
        with:
          name: DZlog-Capture-QA-${{ github.run_number }}
          path: qa-output/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
