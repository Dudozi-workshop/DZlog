name: Capture pipeline Android tests

on:
  push:
    branches:
      - feat/capture-async-pipeline-v1
  pull_request:
    branches:
      - integration/dzlog-20261010
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK 34
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"
      - name: Camera capture unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest --tests 'com.dudoziworkshop.dzlog.data.repository.CaptureQueueCoordinatorTest' --tests 'com.dudoziworkshop.dzlog.data.repository.CapturePendingStoreTest' --tests 'com.dudoziworkshop.dzlog.data.repository.CaptureStagingStoreTest' --tests 'com.dudoziworkshop.dzlog.feature.capture.policy.CaptureReservationPolicyTest' --tests 'com.dudoziworkshop.dzlog.feature.capture.policy.CapturePendingProjectionTest' --tests 'com.dudoziworkshop.dzlog.data.repository.CaptureReceiptRecoveryPolicyTest' --stacktrace
      - name: Android debug compile
        run: ./gradlew :app:assembleDebug --stacktrace
