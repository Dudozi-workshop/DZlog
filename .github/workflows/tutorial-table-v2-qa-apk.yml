name: DZlog Table Tutorial V2 QA APK

on:
  push:
    branches:
      - feat/tutorial-table-editor-v2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dzlog-table-tutorial-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK platform 36
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Run focused tutorial unit tests and compile
        run: bash ./gradlew :app:testDebugUnitTest --tests '*DzlogTutorialSectionsTest' :app:compileDebugKotlin --stacktrace
      - name: Build separately installable QA APK
        run: bash ./gradlew :app:assembleDebug -PdzlogStandaloneQa=true -PdzlogQaInstanceTag=tableguide -PdzlogDebugVersionCode=${{ github.run_number }} --stacktrace
      - name: Upload QA APK
        uses: actions/upload-artifact@v4
        with:
          name: dzlog-table-tutorial-v2-qa-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
