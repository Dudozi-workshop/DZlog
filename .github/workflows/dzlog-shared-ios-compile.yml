name: DZlog Shared Core - iOS Compile

on:
  pull_request:
    branches:
      - milestone/dzlog-pre-onboarding-20261017
    paths:
      - 'shared/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - '.github/workflows/dzlog-shared-ios-compile.yml'

permissions:
  contents: read

concurrency:
  group: dzlog-shared-ios-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ios-compile:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile shared core for iPhone and Apple Silicon simulator
        run: |
          chmod +x ./gradlew
          ./gradlew -PdzlogSharedOnly=true :shared:compileKotlinIosArm64 :shared:compileTestKotlinIosArm64 :shared:compileKotlinIosSimulatorArm64 :shared:compileTestKotlinIosSimulatorArm64 --stacktrace
