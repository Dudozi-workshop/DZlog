name: DZQ-021 Integration Core QA

on:
  push:
    branches:
      - test/dzq021-integration-20261103
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dzq021-integration-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android API 36
        run: |
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - name: Compile and test DZQ-021 core
        run: |
          bash ./gradlew --no-daemon :app:testDebugUnitTest \
            --tests 'com.dudoziworkshop.dzlog.domain.project.*' \
            --tests 'com.dudoziworkshop.dzlog.data.project.*'
      - name: Store focused reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dzq021-integration-core-unit-tests
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
