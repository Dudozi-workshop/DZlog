name: DZQ-021 Integration Core QA

on:
  push:
    branches:
      - test/dzq021-integration-20261103
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dzq021-integration-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android API 36
        run: |
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - name: Compile and test DZQ-021 core
        run: |
          bash ./gradlew --no-daemon :app:testDebugUnitTest \
            --tests 'com.dudoziworkshop.dzlog.domain.project.*' \
            --tests 'com.dudoziworkshop.dzlog.data.project.*' \
            --tests 'com.dudoziworkshop.dzlog.data.repository.CapturePendingStoreTest' \
            --tests 'com.dudoziworkshop.dzlog.data.repository.CaptureRecordReceiptMapperTest' \
            --tests 'com.dudoziworkshop.dzlog.feature.capture.policy.CameraSelectionChangePolicyTest' \
            --tests 'com.dudoziworkshop.dzlog.domain.quickresults.*' \
            --tests 'com.dudoziworkshop.dzlog.domain.gallery.*' \
            --tests 'com.dudoziworkshop.dzlog.feature.log.policy.GalleryViewerDeletePolicyTest' \
            --tests 'com.dudoziworkshop.dzlog.feature.log.policy.GalleryPhotoMovePolicyTest' \
            --tests 'com.dudoziworkshop.dzlog.feature.log.policy.GalleryOriginalNavigationPolicyTest' \
            --tests 'com.dudoziworkshop.dzlog.feature.log.policy.GalleryFolderIndexTest' \
            --tests 'com.dudoziworkshop.dzlog.feature.log.policy.GalleryDefaultStoragePolicyTest' \
            --tests 'com.dudoziworkshop.dzlog.ui.log.RecentCaptureNavigationTest' \
            --tests 'com.dudoziworkshop.dzlog.domain.phrase.RotatingPhraseCsvCodecTest' \
            --tests 'com.dudoziworkshop.dzlog.feature.table.policy.QuickAutoCellEditPolicyTest' \
            --tests 'com.dudoziworkshop.dzlog.feature.table.policy.QuickCellValuePolicyTest' \
            --tests 'com.dudoziworkshop.dzlog.feature.table.policy.QuickRotatingPhrasePolicyTest' \
            --tests 'com.dudoziworkshop.dzlog.feature.table.policy.OnboardingQuickValuePolicyTest' \
            --tests 'com.dudoziworkshop.dzlog.data.template.OnboardingStarterCatalogTest' \
            --tests 'com.dudoziworkshop.dzlog.ui.table.mock.TableEditorPhraseSettingsTest'
      - name: Assemble isolated Android QA APK
        run: |
          bash ./gradlew --no-daemon :app:assembleDebug --stacktrace \
            -PdzlogStandaloneQa=true \
            -PdzlogQaInstanceTag=dzq021
      - name: Verify isolated QA package and debug signature
        run: |
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" |
            grep -F "package: name='com.dudoziworkshop.dzlog.qa.dzq021'"
          "$SDK_ROOT/build-tools/35.0.0/apksigner" verify "$APK"
      - name: Store isolated Android QA APK
        uses: actions/upload-artifact@v4
        with:
          name: dzq021-isolated-qa-debug-apk-unverified-signing
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Store focused reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dzq021-integration-core-unit-tests
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
