name: Quick Preview Cell Badges QA

on:
  push:
    branches:
      - fix/quick-preview-cell-indicators-20261107
    paths:
      - '.github/workflows/dzlog-quick-preview-badges-qa.yml'
      - 'app/src/main/java/com/dudoziworkshop/dzlog/feature/table/policy/QuickPreviewCellBadgePolicy.kt'
      - 'app/src/main/java/com/dudoziworkshop/dzlog/ui/camera/controls/QuickPreviewCellBadges.kt'
      - 'app/src/main/java/com/dudoziworkshop/dzlog/ui/camera/controls/CameraQuickTablePreview.kt'
      - 'app/src/test/java/com/dudoziworkshop/dzlog/feature/table/policy/QuickPreviewCellBadgePolicyTest.kt'
      - 'app/src/main/java/com/dudoziworkshop/dzlog/feature/table/policy/QuickCellValuePolicy.kt'
      - 'app/src/main/java/com/dudoziworkshop/dzlog/ui/camera/controls/CameraQuickValueSheet.kt'
      - 'app/src/test/java/com/dudoziworkshop/dzlog/feature/table/policy/QuickCellValuePolicyTest.kt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-test-isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout badges branch
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - name: Compile, test and assemble with pinned official Gradle image
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          mkdir -p "$RUNNER_TEMP/pr107-gradle-home"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e GRADLE_USER_HOME=/tmp/gradle-home \
            -e ANDROID_HOME="$SDK_ROOT" -e ANDROID_SDK_ROOT="$SDK_ROOT" \
            -v "$PWD:/workspace" -v "$SDK_ROOT:$SDK_ROOT" \
            -v "$RUNNER_TEMP/pr107-gradle-home:/tmp/gradle-home" \
            -w /workspace gradle:8.13.0-jdk21 \
            gradle :app:compileDebugKotlin :app:testDebugUnitTest :app:assembleDebug \
              -PdzlogStandaloneQa=true -PdzlogQaInstanceTag=badges \
              --tests 'com.dudoziworkshop.dzlog.feature.table.policy.QuickPreviewCellBadgePolicyTest' \
              --tests 'com.dudoziworkshop.dzlog.feature.table.policy.QuickCellPresentationPolicyTest' \
              --tests 'com.dudoziworkshop.dzlog.feature.table.policy.QuickCellValuePolicyTest' \
              --tests 'com.dudoziworkshop.dzlog.feature.table.render.CameraTableResolutionTest' \
              --stacktrace
      - name: Upload isolated APK
        uses: actions/upload-artifact@v4
        with:
          name: dzlog-quick-preview-badges-qa-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dzlog-quick-preview-badges-test-report
          path: |
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: ignore
