name: DZlog Android CI

on:
  push:
    branches:
      - feat/table-editor-v2-ux-mock
      - feat/table-detail-v2
      - feat/gallery-v2
      - feat/settings-r31-ux
  workflow_dispatch:
    inputs:
      build_apk:
        description: "Build an APK for device QA"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: dzlog-android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install Android SDK 34
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Verify gallery folder summary test results
        if: github.ref_name == 'feat/gallery-v2'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          report = Path('app/build/test-results/testDebugUnitTest/TEST-com.dudoziworkshop.dzlog.feature.log.policy.GalleryFolderSummaryPolicyTest.xml')
          suite = ET.parse(report).getroot()
          cases = suite.findall('testcase')
          for case in cases:
              status = 'FAIL' if case.find('failure') is not None or case.find('error') is not None else 'SKIP' if case.find('skipped') is not None else 'PASS'
              print(f"GalleryFolderSummaryPolicyTest.{case.attrib['name']}: {status}")
          assert len(cases) == 10, f'Expected 10 gallery summary tests, found {len(cases)}'
          assert all(case.find('failure') is None and case.find('error') is None and case.find('skipped') is None for case in cases), 'Gallery summary tests did not all pass'
          print('GalleryFolderSummaryPolicyTest: 10/10 PASS (Android Gradle XML)')
          PY

      - name: Compile debug Kotlin
        run: ./gradlew :app:compileDebugKotlin

  debug-apk:
    if: >-
      github.ref_name != 'feat/gallery-v2' || (github.event_name == 'workflow_dispatch' && inputs.build_apk) || (github.event_name == 'push' && github.event.head_commit.message == 'ci(gallery): build requested device QA APK')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install Android SDK 34
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Restore persistent test signing key
        env:
          DZLOG_TEST_KEY_BASE64: ${{ secrets.DZLOG_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$DZLOG_TEST_KEY_BASE64" ]]; then
            echo "::error::Set repository secret DZLOG_DEBUG_KEYSTORE_BASE64 once. See docs/debug-apk-updates.md. Refusing to generate a new incompatible signing key."
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/dzlog-test.jks"
          printf '%s' "$DZLOG_TEST_KEY_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          keytool -exportcert -keystore "$KEYSTORE" -storepass android -alias androiddebugkey > "$RUNNER_TEMP/dzlog-test-cert.der"
          echo "DZLOG_DEBUG_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Build and verify update-compatible debug APKs
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$SDK_ROOT/build-tools/34.0.0/apksigner"
          AAPT="$SDK_ROOT/build-tools/34.0.0/aapt"
          FIRST_CODE=$((1000000 + GITHUB_RUN_NUMBER * 2))
          NEXT_CODE=$((FIRST_CODE + 1))
          EXPECTED_CERT="$(sha256sum "$RUNNER_TEMP/dzlog-test-cert.der" | cut -d ' ' -f 1)"
          EXPECTED_PACKAGE="com.dudoziworkshop.dzlog"
          EXTRA_GRADLE_ARGS=()
          if [[ "$GITHUB_REF_NAME" == "feat/gallery-v2" ]]; then
            EXPECTED_PACKAGE="com.dudoziworkshop.dzlog.gallerydev"
            EXTRA_GRADLE_ARGS+=("-PdzlogGalleryStandalone=true")
          fi
          verify_apk() {
            local apk="$1" code="$2" cert badging
            cert="$("$APKSIGNER" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
            test "$cert" = "$EXPECTED_CERT"
            badging="$("$AAPT" dump badging "$apk" | sed -n '1p')"
            [[ "$badging" == *"name='$EXPECTED_PACKAGE'"* ]]
            [[ "$badging" == *"versionCode='$code'"* ]]
            echo "Verified APK: package=$EXPECTED_PACKAGE versionCode=$code certificate=$cert"
          }
          ./gradlew :app:assembleDebug -PdzlogDebugVersionCode="$FIRST_CODE" "${EXTRA_GRADLE_ARGS[@]}" --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/DZlog-baseline.apk"
          verify_apk "$RUNNER_TEMP/DZlog-baseline.apk" "$FIRST_CODE"
          ./gradlew :app:assembleDebug -PdzlogDebugVersionCode="$NEXT_CODE" "${EXTRA_GRADLE_ARGS[@]}" --stacktrace
          verify_apk app/build/outputs/apk/debug/app-debug.apk "$NEXT_CODE"
          echo "Update prerequisites verified: same package and certificate; increasing versionCode. Device install remains a manual check."

      - name: Rename APK
        run: |
          if [[ "$GITHUB_REF_NAME" == "feat/gallery-v2" ]]; then
            cp app/build/outputs/apk/debug/app-debug.apk DZlog-gallery-dev.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk DZlog-v2-test.apk
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name == 'feat/gallery-v2' && 'DZlog-gallery-dev-apk' || 'DZlog-v2-test-apk' }}
          path: ${{ github.ref_name == 'feat/gallery-v2' && 'DZlog-gallery-dev.apk' || 'DZlog-v2-test.apk' }}
          if-no-files-found: error
          retention-days: 14

