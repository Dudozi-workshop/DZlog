name: DZlog PR94 Android16 Startup Runtime

on:
  push:
    branches:
      - refactor/default-template-retire-groups-20261026
  workflow_dispatch:

permissions:
  contents: read

jobs:
  startup-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build isolated QA app
        run: bash ./gradlew --no-daemon :app:assembleDebug -PdzlogStandaloneQa=true -PdzlogQaInstanceTag=pr94 -PdzlogDebugVersionCode=1000094
      - name: Run first-install through starter on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 1200
          script: python3 .github/scripts/dzlog_pr94_onboarding_runtime.py
      - name: Upload crash evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dzlog-pr94-runtime-evidence
          path: |
            pr94-runtime-evidence/
            api36-journey/
          if-no-files-found: warn
          retention-days: 7
