name: DZlog PR88 one-time branch cleanup
on:
  push:
    branches:
      - integration/dzlog-20261010
    paths:
      - '.github/workflows/dzlog-pr88-prune-once.yml'
permissions:
  contents: write
  pull-requests: read
jobs:
  prune:
    if: github.repository == 'Dudozi-workshop/DZlog'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete verified merged PR88 head branch only
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const target = 'fix/onboarding-first-install-folder-20261022';
            const expectedSha = 'f8a6027d674041bf8a9f8a461a813ae61e1d52ac';
            if (context.ref !== 'refs/heads/integration/dzlog-20261010') {
              core.setFailed('Not the Android integration branch.');
              return;
            }
            const pr = (await github.rest.pulls.get({ owner, repo, pull_number: 88 })).data;
            if (pr.state !== 'closed' || !pr.merged_at ||
                pr.base.ref !== 'integration/dzlog-20261010' ||
                pr.head.ref !== target || pr.head.sha !== expectedSha) {
              core.setFailed('PR88 merged state/head did not match expected values.');
              return;
            }
            const open = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100
            });
            if (open.some(p => p.head.ref === target || p.base.ref === target)) {
              core.setFailed('The target branch is referenced by another open PR.');
              return;
            }
            const current = (await github.rest.repos.getBranch({owner, repo, branch: target})).data;
            if (current.protected || current.commit.sha !== expectedSha) {
              core.setFailed('Target branch protected or changed since approval.');
              return;
            }
            await github.rest.git.deleteRef({owner, repo, ref: 'heads/' + target});
            core.info('Deleted merged PR88 work branch: ' + target);
            await core.summary.addHeading('DZlog PR88 cleanup')
              .addRaw('Deleted work branch: ' + target)
              .write();
