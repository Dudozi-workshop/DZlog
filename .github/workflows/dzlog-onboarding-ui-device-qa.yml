name: DZlog Onboarding UI Device QA
on:
  push:
    branches:
      - feat/onboarding-ui-20261015
      - qa/onboarding-integration-20261019
    paths:
      - '.github/scripts/dzlog_onboarding_ui_visual_smoke.py'
      - '.github/workflows/dzlog-onboarding-ui-device-qa.yml'
      - 'app/src/main/java/com/dudoziworkshop/dzlog/ui/onboarding/**'
      - 'app/src/main/res/drawable-nodpi/onboarding_actual_camera_hero.webp'
      - 'app/src/main/java/com/dudoziworkshop/dzlog/ui/navigation/RequiredPermissionSetupScreen.kt'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dzlog-onboarding-ui-device-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Android SDK 36
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - name: Compile and run Android unit tests
        run: bash ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Run compact onboarding E2E on disposable Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 1200
          script: python3 .github/scripts/dzlog_onboarding_ui_visual_smoke.py
      - name: Upload focused UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dzlog-onboarding-ui-evidence
          path: api36-journey/
          if-no-files-found: ignore
  standalone-apk:
    needs: focused-emulator
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK 36
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - name: Build separate-install QA APK
        run: |
          QA_VERSION_CODE="$((1000000 + GITHUB_RUN_NUMBER))"
          bash ./gradlew --no-daemon :app:assembleDebug -PdzlogStandaloneQa=true -PdzlogDebugVersionCode="$QA_VERSION_CODE"
      - name: Verify isolated application identity and APK signature
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -1)"
          echo "$BADGING"
          [[ "$BADGING" == *"name='com.dudoziworkshop.dzlog.qa'"* ]]
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          mkdir -p qa-output
          cp "$APK" qa-output/DZlog-Onboarding-QA.apk
          (cd qa-output && sha256sum DZlog-Onboarding-QA.apk > SHA256SUMS.txt)
      - name: Upload device QA APK only after E2E success
        uses: actions/upload-artifact@v4
        with:
          name: DZlog-Onboarding-Device-QA
          path: qa-output/
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
