name: DZlog Gallery Folder Focused QA

on:
  push:
    branches:
      - feat/gallery-folder-management-v2-20261020
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dzlog-gallery-folder-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gallery-folder-compile-and-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - name: Compile debug Kotlin
        run: |
          chmod +x ./gradlew
          ./gradlew :app:compileDebugKotlin --stacktrace
      - name: Focused folder operation policy tests
        run: ./gradlew :app:testDebugUnitTest --tests 'com.dudoziworkshop.dzlog.feature.log.policy.GalleryFolderOperationPolicyTest' --stacktrace
      - name: Upload focused test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-folder-policy-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 7
