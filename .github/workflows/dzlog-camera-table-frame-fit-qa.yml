name: DZlog Camera Table Frame Fit QA

on:
  push:
    branches:
      - fix/camera-table-frame-fit-20261015
    paths:
      - 'app/src/main/java/com/dudoziworkshop/dzlog/ui/camera/**'
      - 'app/src/main/java/com/dudoziworkshop/dzlog/feature/table/**'
      - 'app/src/main/java/com/dudoziworkshop/dzlog/watermark/**'
      - 'app/src/test/java/com/dudoziworkshop/dzlog/ui/camera/controls/CameraTableResizePolicyTest.kt'
      - '.github/workflows/dzlog-camera-table-frame-fit-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  camera-table-fit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android API 36
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - name: Focused table resize unit tests and compile
        run: bash ./gradlew --no-daemon :app:testDebugUnitTest --tests '*CameraTableResizePolicyTest' :app:assembleDebug
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camera-table-fit-test-results
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
