name: DZlog Full Suite Benchmark (One Shot)

# A single baseline is collected when this workflow file is first introduced.
# Later edits to the selector do not repeatedly start the full suite.
on:
  push:
    branches:
      - ci/dzlog-test-optimization-20261018
    paths:
      - .github/workflows/dzlog-full-suite-benchmark.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-android-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - name: Full Android unit test baseline
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          START="$SECONDS"
          ./gradlew :app:testDebugUnitTest --stacktrace
          echo "### Full suite baseline" >> "$GITHUB_STEP_SUMMARY"
          echo "Gradle wall time: $((SECONDS - START)) seconds" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain full suite evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dzlog-ci-full-suite-baseline
          path: |
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 7
