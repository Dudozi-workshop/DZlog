name: DZlog Post-release Full Journey E2E

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dzlog-postrelease-full-journey
  cancel-in-progress: true

jobs:
  android-full-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Android 16 platform
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - name: Build isolated debug APK
        run: bash ./gradlew --no-daemon :app:assembleDebug
      - name: Test mandatory SAF, onboarding, real BOTH capture, gallery and backup
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 1200
          script: python3 .github/scripts/dzlog_postrelease_full_journey.py
      - name: Upload full-journey evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dzlog-postrelease-full-journey-evidence
          path: |
            postrelease-full-e2e/
            api36-journey/
          if-no-files-found: ignore
