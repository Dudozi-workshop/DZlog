name: DZlog Tutorial Integration QA

on:
  push:
    branches:
      - integration/tutorial-v2-20261020
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dzlog-tutorial-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-compile-and-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android API 36
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Focused tutorial tests and Android compile
        run: bash ./gradlew :app:testDebugUnitTest --tests '*DzlogTutorialSectionsTest' --tests '*DzlogTutorialCatalogTest' :app:compileDebugKotlin --stacktrace
      - name: Build separate QA APK
        run: bash ./gradlew :app:assembleDebug -PdzlogStandaloneQa=true -PdzlogQaInstanceTag=tutorialint -PdzlogDebugVersionCode=${{ github.run_number }} --stacktrace
      - name: Upload isolated QA APK
        uses: actions/upload-artifact@v4
        with:
          name: dzlog-tutorial-integration-qa-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
