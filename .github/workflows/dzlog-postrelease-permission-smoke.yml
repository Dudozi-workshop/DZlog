name: DZlog Post-release Permission Gate Smoke

on:
  push:
    branches:
      - integration/dzlog-postrelease-staging-20261014
    paths:
      - '.github/scripts/dzlog-integrated-permission-smoke.py'
      - '.github/workflows/dzlog-postrelease-permission-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dzlog-postrelease-permission-smoke
  cancel-in-progress: true

jobs:
  mandatory-setup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android API 36 platform
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - name: Build staging APK
        run: bash ./gradlew --no-daemon :app:assembleDebug
      - name: Test mandatory Android 16 setup gates
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 1200
          script: python3 .github/scripts/dzlog-integrated-permission-smoke.py
      - name: Upload setup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dzlog-postrelease-permission-evidence
          path: postrelease-permissions/
          if-no-files-found: ignore
