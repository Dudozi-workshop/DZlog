name: DZlog Issue 39 Isolated Emulator QA

on:
  push:
    branches:
      - qa/issue39-minimal-emulator-20261018
    paths:
      - '.github/scripts/issue39_minimal_emulator_qa.py'
      - '.github/workflows/issue39-minimal-emulator-qa.yml'

permissions:
  contents: read

jobs:
  issue39-minimal-android:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android API 36
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - name: Build disposable emulator APK (not distributed)
        run: bash ./gradlew --no-daemon :app:assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test only Issue 39 isolated cases
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 1200
          script: python3 .github/scripts/issue39_minimal_emulator_qa.py
      - name: Preserve failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue39-minimal-emulator-evidence
          path: |
            issue39-evidence/
            api36-journey/issue39-*
            api36-journey/FAILED-issue39*
            postrelease-full-e2e/
          if-no-files-found: ignore
          retention-days: 7
