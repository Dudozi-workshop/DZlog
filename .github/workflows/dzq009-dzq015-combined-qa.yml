name: DZlog DZQ-009 and 015 Combined QA
on:
  push:
    branches:
      - qa/dzq009-dzq015-combined-20261018
  workflow_dispatch:
permissions:
  contents: read
jobs:
  combined-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test combined features and build isolated QA APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug -PdzlogStandaloneQa=true -PdzlogQaInstanceTag=dzqcombo --stacktrace
      - name: Upload test reports and isolated QA APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dzq009-dzq015-combined-qa
          path: |
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/tests/testDebugUnitTest/**
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14
