name: DZlog DZQ-015 Save Rule Copy QA
on:
  push:
    branches:
      - feat/dzq015-save-rule-copy-20261017
    paths:
      - .github/workflows/dzq015-save-rule-copy-qa.yml
      - app/src/main/java/com/dudoziworkshop/dzlog/ui/table/mock/**
      - app/src/test/java/com/dudoziworkshop/dzlog/ui/table/mock/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  save-rule-copy-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Android unit tests and compile
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Upload unit test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dzq015-unit-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 14
