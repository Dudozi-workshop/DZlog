name: DZlog CaptureSoundOutputPolicyTest Focused QA

on:
  push:
    branches:
      - fix/dzq018-capture-sound-20261022
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dzq018-capture-sound-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-android-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android API 36
        run: |
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - name: Compile and run focused tests
        run: |
          bash ./gradlew --no-daemon :app:testDebugUnitTest --tests 'com.dudoziworkshop.dzlog.feature.capture.policy.CaptureSoundOutputPolicyTest'
      - name: Build isolated sound QA APK
        run: |
          bash ./gradlew --no-daemon :app:assembleDebug \
            -PdzlogStandaloneQa=true -PdzlogQaInstanceTag=sfx5
      - name: Upload isolated sound QA APK
        uses: actions/upload-artifact@v4
        with:
          name: dzlog-sfx5-single-path-qa-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CaptureSoundOutputPolicyTest-results
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
