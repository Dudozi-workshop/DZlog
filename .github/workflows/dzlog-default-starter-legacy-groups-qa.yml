name: DZlog Default Starter and Legacy Group QA

on:
  push:
    branches:
      - refactor/default-template-retire-groups-20261026
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android API 36
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - name: Focused starter, editor and legacy grouping tests
        run: |
          bash ./gradlew :app:testDebugUnitTest --tests '*OnboardingStarterCatalogTest' --tests '*TableStructureMutationTest' --tests '*TableEditorInlineEditActionsTest' --tests '*TableEditorSelectedCellActionBinderTest' --tests '*CounterManagerScopePrefixTest' --tests '*CounterScopePathPolicyTest' --tests '*CaptureNamingPolicyPathConsistencyTest' --tests '*GalleryFolderIndexTest' :app:compileDebugKotlin --stacktrace
