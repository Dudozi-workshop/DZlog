name: DZlog Onboarding Integrated Capture Regression QA
on:
  push:
    branches:
      - qa/onboarding-integration-20261019
    paths:
      - '.github/scripts/dzlog_onboarding_integration_capture_regression.py'
      - '.github/workflows/dzlog-onboarding-integration-regression-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dzlog-onboarding-integrated-regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integrated-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Android SDK 36
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - name: Build and run Android unit tests
        run: bash ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Run disposable Android 16 integrated capture regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 1200
          script: python3 .github/scripts/dzlog_onboarding_integration_capture_regression.py
      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dzlog-onboarding-integrated-regression-evidence
          path: api36-journey/
          if-no-files-found: ignore
