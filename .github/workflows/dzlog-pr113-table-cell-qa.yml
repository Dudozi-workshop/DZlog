name: PR113 Table Cell Settings QA

on:
  push:
    branches:
      - feat/table-cell-phrase-compact-ui-20261113
    paths:
      - 'app/**'
      - '.github/workflows/dzlog-pr113-table-cell-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dzlog-pr113-table-cell-qa
  cancel-in-progress: true

jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK 36
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - name: Bootstrap Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/^networkTimeout=.*/networkTimeout=120000/' gradle/wrapper/gradle-wrapper.properties
          grep -q '^distributionSha256Sum=' gradle/wrapper/gradle-wrapper.properties || \
            echo 'distributionSha256Sum=20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78' \
            >> gradle/wrapper/gradle-wrapper.properties
          for url in \
            'https://mirrors.huaweicloud.com/gradle/gradle-8.13-bin.zip' \
            'https://mirrors.aliyun.com/gradle/distributions/v8.13.0/gradle-8.13-bin.zip' \
            'https://services.gradle.org/distributions/gradle-8.13-bin.zip'; do
            sed -i '/^distributionUrl=/d' gradle/wrapper/gradle-wrapper.properties
            printf 'distributionUrl=%s\n' "$url" >> gradle/wrapper/gradle-wrapper.properties
            if bash ./gradlew --version; then
              break
            fi
          done
          bash ./gradlew --version

      - name: Compile debug
        run: bash ./gradlew :app:compileDebugKotlin --stacktrace

      - name: Run all debug unit tests
        run: bash ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Upload tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr113-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: ignore
