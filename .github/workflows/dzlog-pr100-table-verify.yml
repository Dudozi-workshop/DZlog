name: PR100 Table Editor Targeted Verification

on:
  push:
    branches:
      - fix/table-detail-camera-parity-20261107
    paths:
      - 'app/**'
      - '.github/workflows/dzlog-pr100-table-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dzlog-pr100-table-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-and-targeted-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK 36
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compile Android debug Kotlin
        run: bash ./gradlew :app:compileDebugKotlin --stacktrace
      - name: Focused table editor and camera regression tests
        run: |
          bash ./gradlew :app:testDebugUnitTest \
            --tests 'com.dudoziworkshop.dzlog.ui.table.mock.TableEditorRenderCellsTest' \
            --tests 'com.dudoziworkshop.dzlog.feature.table.editor.TableEditorSlotReferencePolicyTest' \
            --tests 'com.dudoziworkshop.dzlog.ui.table.mock.TableEditorV2SessionStateTest' \
            --tests 'com.dudoziworkshop.dzlog.ui.table.mock.MockLayoutDomainAdapterTest' \
            --tests 'com.dudoziworkshop.dzlog.feature.table.editor.TableStructureRangeActionsTest' \
            --tests 'com.dudoziworkshop.dzlog.feature.table.render.CameraTableResolutionTest' \
            --stacktrace
      - name: Upload targeted test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr100-table-targeted-test-report
          path: |
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: ignore
