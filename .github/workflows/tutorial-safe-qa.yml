name: DZlog Tutorial Safe Integration QA

on:
  push:
    branches:
      - integration/tutorial-safe-20261020

permissions:
  contents: read

jobs:
  integration-check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Regression and compile
        run: bash ./gradlew :app:testDebugUnitTest :app:compileDebugKotlin --stacktrace
      - name: Build QA APK
        run: bash ./gradlew :app:assembleDebug -PdzlogStandaloneQa=true -PdzlogQaInstanceTag=tutorialsafe -PdzlogDebugVersionCode=${{ github.run_number }} --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: dzlog-tutorial-safe-qa-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
