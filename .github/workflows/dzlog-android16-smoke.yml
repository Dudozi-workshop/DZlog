name: DZlog Android 16 Emulator Smoke
on:
  push:
    branches:
      - feat/android16-api36-readiness-20261013
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dzlog-api36-emulator
  cancel-in-progress: true

jobs:
  install-and-launch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build API 36 debug APK
        run: bash ./gradlew --no-daemon :app:assembleDebug
      - name: Android 16 fresh-install smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 1200
          script: |
            bash .github/scripts/android16_first_launch_smoke.sh
            python3 .github/scripts/android16_journey_smoke.py
            python3 .github/scripts/android16_editor_keyboard_smoke.py
            python3 .github/scripts/android16_gallery_smoke.py
            python3 .github/scripts/android16_capture_media_smoke.py
            python3 .github/scripts/android16_backup_saf_smoke.py
            python3 .github/scripts/android16_rapid_shutter_smoke.py
            python3 .github/scripts/android16_permission_return_smoke.py
            python3 .github/scripts/android16_responsive_smoke.py
            adb shell dumpsys window > api36-window-dump.txt
      - name: Upload startup screenshot and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dzlog-api36-smoke-evidence
          path: |
            api36-fresh-start.png
            api36-launch-log.txt
            api36-ui.xml
            api36-window-dump.txt
            api36-journey/
          if-no-files-found: ignore
