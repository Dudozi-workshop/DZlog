name: DZlog M2 Shared UI PoC
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [milestone/dzlog-pre-onboarding-20261017]
    paths:
      - '**'
      - '!app/**'
      - '!billing-server/**'
      - '!docs/**'
      - '!README.md'
      - '!.github/**'
      - '.github/scripts/dzlog_ci_reuse*'
      - '.github/workflows/dzlog-ios-ui-poc.yml'
  workflow_dispatch:
    inputs:
      scope:
        description: 'editor = focused development check; full = complete UI regression'
        type: choice
        options: [full, editor]
        default: full
permissions:
  contents: read
  actions: read
concurrency:
  group: dzlog-ios-ui-poc-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  simulator-ui:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select development or full UI scope
        id: scope
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const sameRepoDraft = pr?.draft === true && pr.head.repo.full_name === `${context.repo.owner}/${context.repo.repo}`;
            const scope = context.eventName === 'workflow_dispatch'
              ? context.payload.inputs.scope
              : sameRepoDraft && context.payload.action !== 'ready_for_review' ? 'editor' : 'full';
            if (!['editor', 'full'].includes(scope)) throw new Error('Invalid UI test scope');
            core.setOutput('value', scope);
            await core.summary.addHeading(`iOS UI scope: ${scope}`)
              .addRaw(scope === 'editor'
                ? 'Development check: editor flow only. This is NOT full UI regression approval.\n'
                : 'Complete UI regression checkpoint.\n').write();
      - name: Reuse only identical successful full UI inputs
        id: reuse
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            core.setOutput('run', 'true');
            await require('./.github/scripts/dzlog_ci_reuse.cjs')({github, context, core, platform: 'ui'});
      - uses: actions/setup-java@v4
        if: steps.reuse.outputs.run != 'false'
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.reuse.outputs.run != 'false'
      - name: Identify native toolchain
        id: toolchain
        if: steps.reuse.outputs.run != 'false'
        run: |
          toolchain_key="$({ xcodebuild -version; java -version 2>&1; } | shasum -a 256 | cut -d' ' -f1)"
          echo "key=$toolchain_key" >> "$GITHUB_OUTPUT"
      - name: Restore exact native framework
        id: framework-cache
        continue-on-error: true
        if: steps.reuse.outputs.run != 'false' && steps.reuse.outputs.framework != ''
        uses: actions/cache/restore@v4
        with:
          path: sharedUi/build/bin/iosSimulatorArm64/debugFramework
          key: dzlog-ui-framework-v1-${{ github.event.pull_request.number }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ steps.reuse.outputs.framework }}
      - name: Build existing shared UI for iPhone and simulator
        if: steps.reuse.outputs.run != 'false' && steps.framework-cache.outputs.cache-hit != 'true'
        run: bash ./gradlew -PdzlogSharedOnly=true -PdzlogUiPoc=true :sharedUi:compileKotlinIosArm64 :sharedUi:linkDebugFrameworkIosSimulatorArm64 --stacktrace
      - name: Save compiled framework even if later UI tests fail
        if: steps.reuse.outputs.run != 'false' && steps.reuse.outputs.framework != '' && steps.framework-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: sharedUi/build/bin/iosSimulatorArm64/debugFramework
          key: ${{ steps.framework-cache.outputs.cache-primary-key }}
      - name: Focused iOS editor flow (partial development check)
        if: steps.reuse.outputs.run != 'false' && steps.scope.outputs.value == 'editor'
        env:
          DZLOG_UI_TEST_SCOPE: editor
        run: bash scripts/ios/test-ui-poc.sh
      - name: Complete iOS UI suite (no partial selection)
        if: steps.reuse.outputs.run != 'false' && steps.scope.outputs.value == 'full'
        env:
          DZLOG_UI_TEST_SCOPE: full
        run: bash scripts/ios/test-ui-poc.sh
      - name: Preserve UI evidence
        if: always() && steps.reuse.outputs.run != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: dzlog-ios-ui-poc-${{ steps.scope.outputs.value }}-evidence
          path: build/ios-poc/evidence/**
          if-no-files-found: warn
          retention-days: 7
