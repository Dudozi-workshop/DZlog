name: DZlog Unified Mainline CI

on:
  pull_request:
    branches:
      - milestone/dzlog-pre-onboarding-20261017
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  push:
    branches:
      - milestone/dzlog-pre-onboarding-20261017
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      build_qa_apk:
        description: Build an isolated APK only when device QA is requested
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# A newer commit supersedes pending CI for the same PR or integration branch.
concurrency:
  group: dzlog-mainline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - name: Complete Android unit suite (no partial selection)
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Verify dormant billing backend
        shell: bash
        run: node --test billing-server/test/*.test.mjs
      - name: Preserve unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dzlog-mainline-unit-reports
          path: |
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 7
      - name: Build isolated QA APK only when requested
        if: github.event_name == 'workflow_dispatch' && inputs.build_qa_apk
        shell: bash
        run: |
          set -euo pipefail
          QA_TAG="m${GITHUB_RUN_NUMBER}"
          ./gradlew :app:assembleDebug -PdzlogStandaloneQa=true -PdzlogQaInstanceTag="$QA_TAG"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          BADGING="$("$SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" | head -1)"
          echo "$BADGING"
          [[ "$BADGING" == *"name='com.dudoziworkshop.dzlog.qa.$QA_TAG'"* ]]
          "$SDK_ROOT/build-tools/35.0.0/apksigner" verify "$APK"
      - name: Upload requested QA APK
        if: github.event_name == 'workflow_dispatch' && inputs.build_qa_apk && success()
        uses: actions/upload-artifact@v4
        with:
          name: dzlog-mainline-manual-qa-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
