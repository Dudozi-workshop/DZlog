name: DZlog Focused CI (Pilot)

on:
  push:
    branches:
      - ci/dzlog-test-optimization-20261018
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dzlog-focused-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      mode: ${{ steps.select.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test selection rules
        run: python3 -m unittest discover -s .github/scripts -p 'test_dzlog_ci_test_selector.py' -v
      - name: Select checks relative to preserved milestone
        id: select
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin milestone/dzlog-pre-onboarding-20261017
          python3 .github/scripts/dzlog_ci_test_selector.py --base origin/milestone/dzlog-pre-onboarding-20261017 --head HEAD | tee "$RUNNER_TEMP/test-selection.txt"
          MODE="$(sed -n 's/^MODE=//p' "$RUNNER_TEMP/test-selection.txt")"
          case "$MODE" in focused|full|none) ;; *) exit 1 ;; esac
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "### Test selection: $MODE" >> "$GITHUB_STEP_SUMMARY"
          sed -n 's/^REASON=/Reason: /p' "$RUNNER_TEMP/test-selection.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload selector report
        uses: actions/upload-artifact@v4
        with:
          name: dzlog-focused-ci-selection
          path: ${{ runner.temp }}/test-selection.txt
          retention-days: 7

  selected-android-tests:
    needs: verify-policy
    if: needs.verify-policy.outputs.mode != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - name: Execute chosen test set (fail closed)
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin milestone/dzlog-pre-onboarding-20261017
          python3 .github/scripts/dzlog_ci_test_selector.py --base origin/milestone/dzlog-pre-onboarding-20261017 --head HEAD > "$RUNNER_TEMP/test-selection.txt"
          MODE="$(sed -n 's/^MODE=//p' "$RUNNER_TEMP/test-selection.txt")"
          echo "Selection mode: $MODE"
          chmod +x ./gradlew
          START="$SECONDS"
          case "$MODE" in
            focused)
              mapfile -t CLASSES < <(sed -n 's/^TEST=//p' "$RUNNER_TEMP/test-selection.txt")
              if [ "${#CLASSES[@]}" -eq 0 ]; then
                echo "::error::No focused tests were selected"
                exit 1
              fi
              ARGS=()
              for CLASS in "${CLASSES[@]}"; do
                ARGS+=("--tests" "$CLASS")
              done
              printf 'Executing %s selected test classes\n' "${#CLASSES[@]}"
              ./gradlew :app:testDebugUnitTest "${ARGS[@]}" --stacktrace
              ;;
            full)
              echo "Safety fallback: full Android unit suite"
              ./gradlew :app:testDebugUnitTest --stacktrace
              ;;
            *)
              echo "::error::Unexpected selection mode: $MODE"
              exit 1
              ;;
          esac
          echo "### Android CI: $MODE" >> "$GITHUB_STEP_SUMMARY"
          echo "Wall time for this step: $((SECONDS - START)) seconds" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dzlog-focused-android-test-report
          path: |
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 7
