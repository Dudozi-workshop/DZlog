name: DZlog Onboarding Premerge Capture Data QA
on:
  push:
    branches:
      - qa/onboarding-premerge-20261020
    paths:
      - '.github/workflows/dzlog-onboarding-capture-premerge-qa.yml'
      - '.github/scripts/dzlog_onboarding_integrated_capture_premerge.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dzlog-onboarding-premerge-capture-${{ github.ref }}
  cancel-in-progress: true
jobs:
  data-protection:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Enable KVM for Android 16
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - name: Build integration candidate (previous unit QA already verified)
        run: bash ./gradlew --no-daemon :app:assembleDebug
      - name: Exercise real capture, MediaStore, permission recovery and update-install
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 1200
          script: python3 .github/scripts/dzlog_onboarding_integrated_capture_premerge.py
      - name: Preserve data-protection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dzlog-onboarding-premerge-capture-evidence
          path: api36-journey/
          if-no-files-found: ignore
