name: DZlog Combined Device QA

on:
  push:
    branches:
      - qa/dzlog-ux-batch-20261026
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dzlog-ux-batch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-tests-and-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android API 36
        run: |
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - name: Focused regression tests
        run: |
          bash ./gradlew --no-daemon :app:testDebugUnitTest \
            --tests 'com.dudoziworkshop.dzlog.feature.capture.policy.CaptureSoundOutputPolicyTest' \
            --tests 'com.dudoziworkshop.dzlog.feature.table.policy.QuickCellValuePolicyTest' \
            --tests 'com.dudoziworkshop.dzlog.feature.table.state.TableTemplateCatalogLiveInputTest' \
            --tests 'com.dudoziworkshop.dzlog.domain.project.CaptureProjectRegistryTest'
      - name: Build isolated combined QA APK
        run: |
          bash ./gradlew --no-daemon :app:assembleDebug \
            -PdzlogStandaloneQa=true -PdzlogQaInstanceTag=batch1
      - name: Upload single combined QA APK
        uses: actions/upload-artifact@v4
        with:
          name: dzlog-batch1-ux-qa-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload focused test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dzlog-batch1-focused-results
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
