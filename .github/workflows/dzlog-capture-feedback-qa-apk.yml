name: DZlog Capture Feedback Isolated APK

on:
  push:
    branches:
      - feat/capture-feedback-options-20261018
    paths:
      - '.github/workflows/dzlog-capture-feedback-qa-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dzlog-capture-feedback-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-feedback-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Android SDK 36
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - name: Gradle setup
        uses: gradle/actions/setup-gradle@v4
      - name: Build independently installable QA APK
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug \
            -PdzlogStandaloneQa=true \
            -PdzlogQaInstanceTag=sfx \
            -PdzlogDebugVersionCode=19901018 \
            --stacktrace
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          AAPT="$SDK_ROOT/build-tools/35.0.0/aapt"
          BADGING="$("$AAPT" dump badging "$APK" | head -n 1)"
          echo "$BADGING"
          [[ "$BADGING" == *"name='com.dudoziworkshop.dzlog.qa.sfx'"* ]]
          [[ "$BADGING" == *"versionCode='19901018'"* ]]
          mkdir -p qa-output
          cp "$APK" qa-output/DZlog-Capture-Feedback-QA.apk
          (cd qa-output && sha256sum DZlog-Capture-Feedback-QA.apk > SHA256SUMS.txt)
      - name: Publish isolated QA install package
        uses: actions/upload-artifact@v4
        with:
          name: DZlog-Capture-Feedback-QA
          path: qa-output/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
