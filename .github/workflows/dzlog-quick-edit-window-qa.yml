name: DZlog Quick Edit Window QA

on:
  workflow_dispatch:
  push:
    branches:
      - fix/quick-edit-window-20261014

permissions:
  contents: read

concurrency:
  group: dzlog-quick-edit-window
  cancel-in-progress: true

jobs:
  quick-edit-window:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Android API 36
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - name: Compile debug APK
        run: bash ./gradlew --no-daemon :app:assembleDebug
      - name: Check only quick edit input and retained previews
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 1200
          script: python3 .github/scripts/dzlog_quick_value_ime_smoke.py --standalone
      - name: Upload quick edit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quick-edit-window-evidence
          path: |
            api36-journey/
            postrelease-full-e2e/
          if-no-files-found: ignore
