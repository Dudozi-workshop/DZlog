name: QA Camera Focus Lock PR112
on:
  pull_request:
    branches:
      - integration/dzlog-20261010
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-camera-focus:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check preinstalled Android SDK
        run: test -f "$ANDROID_HOME/platforms/android-36/android.jar"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile Android and run unit tests
        run: bash ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest --no-daemon --stacktrace
