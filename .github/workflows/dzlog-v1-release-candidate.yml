name: DZlog v1.0.0 Release Candidate Check
on:
  push:
    branches:
      - release/dzlog-v1.0.0-prep-20261017
    paths:
      - .github/workflows/dzlog-v1-release-candidate.yml
      - app/**
      - gradle/**
      - build.gradle.kts
      - settings.gradle.kts
      - gradle.properties
      - gradlew
      - gradlew.bat
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unsigned-release-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Check intended release version
        shell: bash
        run: |
          grep -F 'versionName = "1.0.0"' app/build.gradle.kts
          grep -F 'versionCode = 3' app/build.gradle.kts
          grep -F 'applicationId = "com.dudoziworkshop.dzlog"' app/build.gradle.kts
      - name: Unit tests and unsigned release bundle
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:bundleRelease --stacktrace
      - name: Preserve unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dzlog-v1-0-0-unit-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 14
      - name: Verify unsigned bundle exists
        shell: bash
        run: |
          test -s app/build/outputs/bundle/release/app-release.aab
          echo "Unsigned release candidate bundle built. DO NOT upload this artifact to Play."
      - name: Upload UNSIGNED candidate (NOT FOR PLAY)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dzlog-v1-0-0-unsigned-DO-NOT-UPLOAD
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
