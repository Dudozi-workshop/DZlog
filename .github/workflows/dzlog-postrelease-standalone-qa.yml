name: DZlog Standalone Device QA APK

on:
  push:
    branches:
      - integration/dzlog-postrelease-staging-20261014
    paths:
      - 'app/build.gradle.kts'
      - 'app/src/main/java/com/dudoziworkshop/dzlog/ui/camera/controls/CameraQuickValueSheet.kt'
      - 'app/src/main/java/com/dudoziworkshop/dzlog/feature/help/**'
      - 'app/src/main/java/com/dudoziworkshop/dzlog/ui/onboarding/**'
      - 'app/src/main/java/com/dudoziworkshop/dzlog/ui/navigation/AppNavigation.kt'
      - 'app/src/main/java/com/dudoziworkshop/dzlog/ui/camera/CameraScreen.kt'
      - 'app/src/main/java/com/dudoziworkshop/dzlog/feature/settings/ui/SettingsScreen.kt'
      - 'app/src/main/java/com/dudoziworkshop/dzlog/feature/settings/ui/SettingsRootScreen.kt'
      - '.github/scripts/dzlog_quick_value_ime_smoke.py'
      - '.github/workflows/dzlog-postrelease-standalone-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-device-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android 16 build dependencies
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - name: Build a distinct QA application ID
        run: |
          QA_VERSION_CODE="$((1000000 + GITHUB_RUN_NUMBER))"
          bash ./gradlew --no-daemon :app:assembleDebug -PdzlogStandaloneQa=true -PdzlogDebugVersionCode="$QA_VERSION_CODE"
      - name: Verify package never matches the Play application ID
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -s "$APK"
          BADGING="$("$AAPT" dump badging "$APK" | head -1)"
          echo "$BADGING"
          [[ "$BADGING" == *"name='com.dudoziworkshop.dzlog.qa'"* ]]
          [[ "$BADGING" != *"name='com.dudoziworkshop.dzlog'"* ]]
          "$APKSIGNER" verify "$APK"
          mkdir -p qa-output
          cp "$APK" qa-output/DZlog-Standalone-QA.apk
          (cd qa-output && sha256sum DZlog-Standalone-QA.apk > SHA256SUMS.txt)
      - name: Upload installable standalone QA APK
        uses: actions/upload-artifact@v4
        with:
          name: DZlog-Standalone-Device-QA
          path: qa-output/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
