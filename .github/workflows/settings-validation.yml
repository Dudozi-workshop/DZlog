name: DZlog Settings Validation

on:
  push:
    branches:
      - feat/settings-r31-ux
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dzlog-settings-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install Android SDK 34
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable Gradle wrapper
        run: chmod +x ./gradlew

      - name: Compile and run Android unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
