name: DZlog Rotating Phrase CSV Focused QA

on:
  push:
    branches:
      - feat/rotating-phrase-csv-20261107
    paths:
      - 'app/**'
      - '.github/workflows/dzlog-phrase-csv-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dzlog-phrase-csv
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK 36
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - name: Test CSV parsing persistence and editor integration
        run: |
          bash ./gradlew :app:testDebugUnitTest \
            --tests '*RotatingPhraseCsvCodecTest' \
            --tests '*TableEditorPhraseSettingsTest' \
            --tests '*RotatingPhrasePersistenceTest' \
            --tests '*QuickRotatingPhrasePolicyTest' \
            --tests '*CellPhraseProgressTest' \
            --tests '*RotatingCaptureCommitPersistenceTest' \
            :app:compileDebugKotlin --stacktrace
      - name: Build separate-install APK
        run: |
          set -euo pipefail
          bash ./gradlew :app:assembleDebug \
            -PdzlogStandaloneQa=true \
            -PdzlogQaInstanceTag=phrasecsv \
            -PdzlogDebugVersionCode=1000103 --stacktrace
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$SDK_ROOT/build-tools/35.0.0/apksigner" verify "$APK"
          "$SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" | grep -m1 "package: name='com.dudoziworkshop.dzlog.qa.phrasecsv' versionCode='1000103'"
          cp "$APK" DZlog-phrase-csv-qa.apk
      - name: Upload QA APK
        uses: actions/upload-artifact@v4
        with:
          name: dzlog-phrase-csv-qa-apk
          path: DZlog-phrase-csv-qa.apk
          if-no-files-found: error
          retention-days: 14
