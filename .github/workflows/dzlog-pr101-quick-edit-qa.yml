name: DZlog PR101 Quick Edit Focused QA

on:
  push:
    branches:
      - fix/quick-edit-unlock-cells-20261107
    paths:
      - 'app/**'
      - '.github/workflows/dzlog-pr101-quick-edit-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dzlog-pr101-quick-edit
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK 36
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - name: Run only quick edit and template regression tests
        run: |
          bash ./gradlew :app:testDebugUnitTest \
            --tests '*QuickCellValuePolicyTest' \
            --tests '*QuickAutoCellEditPolicyTest' \
            --tests '*OnboardingQuickValuePolicyTest' \
            --tests '*OnboardingStarterCatalogTest' \
            --tests '*QuickCellPresentationPolicyTest' \
            --tests '*QuickEditSelectionMemoryTest' \
            --tests '*TemplateEditCaptureSyncTest' \
            :app:compileDebugKotlin --stacktrace
      - name: Build separate-install QA APK
        shell: bash
        run: |
          set -euo pipefail
          bash ./gradlew :app:assembleDebug \
            -PdzlogStandaloneQa=true \
            -PdzlogQaInstanceTag=pr101fix \
            -PdzlogDebugVersionCode=1000101 --stacktrace
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$SDK_ROOT/build-tools/35.0.0/apksigner" verify "$APK"
          "$SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" | grep -m1 "package: name='com.dudoziworkshop.dzlog.qa.pr101fix' versionCode='1000101'"
          cp "$APK" DZlog-PR101-quick-edit-qa.apk
      - name: Upload isolated QA APK
        uses: actions/upload-artifact@v4
        with:
          name: dzlog-pr101-quick-edit-qa-apk
          path: DZlog-PR101-quick-edit-qa.apk
          if-no-files-found: error
          retention-days: 14
