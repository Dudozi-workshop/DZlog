name: DZlog PR88 onboarding copy QA once
on:
  push:
    branches: [fix/onboarding-first-install-folder-20261022]
    paths:
      - 'app/src/main/java/com/dudoziworkshop/dzlog/ui/navigation/GalleryPermissionOnboarding.kt'
      - 'app/src/main/java/com/dudoziworkshop/dzlog/ui/navigation/RequiredPermissionSetupScreen.kt'
      - '.github/workflows/onboarding-folder-copy-qa-once.yml'
permissions:
  contents: read
jobs:
  verify-copy-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Install Android 36 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - name: Compile focused change and build isolated APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:compileDebugKotlin :app:assembleDebug -PdzlogStandaloneQa=true -PdzlogQaInstanceTag=autofolder -PdzlogDebugVersionCode=1000089 --stacktrace
      - name: Verify QA APK package
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          "$SDK_ROOT/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/debug/app-debug.apk
          "$SDK_ROOT/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -m1 "package: name='com.dudoziworkshop.dzlog.qa.autofolder' versionCode='1000089'"
          cp app/build/outputs/apk/debug/app-debug.apk DZlog-PR88-Pictures-guide-QA.apk
      - name: Upload isolated QA APK
        uses: actions/upload-artifact@v4
        with:
          name: DZlog-PR88-Pictures-guide-QA
          path: DZlog-PR88-Pictures-guide-QA.apk
          if-no-files-found: error
          retention-days: 14
